# 填写模板，不是可直接执行的 Case；TBD/null 必须在正式冻结前解决。
schemaVersion: cwatch.eval-case.v1-draft
id: TBD
revision: 1
familyId: TBD
title: TBD
status: draft
split: regression
origin:
  layer: manual # manual / observed_failure / synthetic
  environment: authored # authored / development_acceptance / production
  originalRunId: null
  parentCaseIds: []
  author: null
  reviewer: null
scope:
  level: agent # component / runtime / agent
  executionMode: frozen_tools_live_model # deterministic / frozen_tools_live_model / live
oracle:
  reviewStatus: needs_review
  references: [] # source URL/path、原始字节 sha256、人工核验字段、核验时间
  knownLimits: []

# 以下六项必须齐全。控制器只向 Agent 投放允许的输入；不投放 oracle 和期望。
input:
  userMessage: TBD
  clock: { now: null, timezone: Asia/Shanghai }
  window: { start: null, end: null, basis: published_at, bounds: '[start,end)' }
  materialRefs: []
  initialState: {} # 必要 Memory、已有证据、权限；运行之间重置
  toolEnvironment: {} # 工具/路由指纹、固定响应、调用匹配规则；由控制器持有
  permissions: { mode: explore, allowedSources: [] }
  budgets: {} # 按执行层填写；不适用要说明，不能留给无限重试
expected_final:
  allowedRunStatuses: []
  requiredFacts: [] # 每项 {id, assertion, oracleRefs}
  requiredGaps: []
  forbiddenClaims: []
  allowedAlternatives: []
expected_process:
  constraints: [] # {id, assertion, relation, evidenceRequired}
safety_boundaries:
  constraints: [] # {id, assertion, evidenceRequired}
scoring:
  checks: [] # {id, requirementRefs, method, required, hardFail, failureCode}；引用需求 ID 或稳定字段路径
  aggregation: all_required_pass_no_hard_fail
  onUnknownRequired: needs_review
failure_taxonomy:
  allowedCodes: [] # 与 checks.failureCode 一致；工具错误不自动等于评测失败
