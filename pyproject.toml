[project]
name = "cwatch-benchmark"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepeval==3.9.7",
    "openai>=2",
    "pydantic>=2",
    "pytest>=8",
    "portalocker[win32]>=4; sys_platform == 'win32'",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
junit_family = "xunit1"
