name: 项目检查
on: [push, pull_request]

# GitHub-hosted Ubuntu runners execute jobs in the same Node 24 / Debian image.
# Trixie's fd supports the SDK's --no-require-git; Bookworm's fd 8.6 does not.
permissions:
  contents: read

jobs:
  regression:
    name: 工程检查
    runs-on: ubuntu-latest
    container:
      image: node:24-trixie
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Pi's grep/find tools need native binaries, absent from the Node image.
      # Debian calls fd "fdfind"; the SDK recognizes that name on PATH.
      - name: 安装检索工具依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ripgrep fd-find
          rg --version
          fdfind --version
          fdfind --help | grep -q -- '--no-require-git'
      - name: 安装项目依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 运行常规测试
        run: npm run verify
      - name: 归档工程检查产物
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: 工程检查产物
          path: artifacts/
